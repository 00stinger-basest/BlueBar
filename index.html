<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BlueBar 3.1</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="icons/bluebar-icon.png">
</head>

<body>
  <div id="app">

    <!-- HEADER -->
    <header class="app-header">
      <h1>BlueBar</h1>
      <p class="subtitle">Your smart home bar</p>
    </header>

    <!-- MAIN LAYOUT -->
    <main class="app-main">

      <!-- INVENTORY PANEL -->
      <section class="panel inventory-panel">
        <h2>Inventory</h2>

        <!-- Liquors & Spirits -->
        <div class="inventory-section">
          <div class="section-header">
            <span class="section-icon" id="icon-liquors"></span>
            <span class="section-title">Liquors & Spirits</span>
          </div>
          <div class="section-body" id="inventory-liquors"></div>
        </div>

        <!-- Liqueurs & Aperitifs -->
        <div class="inventory-section">
          <div class="section-header">
            <span class="section-icon" id="icon-liqueurs"></span>
            <span class="section-title">Liqueurs & Aperitifs</span>
          </div>
          <div class="section-body" id="inventory-liqueurs"></div>
        </div>

        <!-- Fortified Wines -->
        <div class="inventory-section">
          <div class="section-header">
            <span class="section-icon" id="icon-fortified"></span>
            <span class="section-title">Fortified Wines</span>
          </div>
          <div class="section-body" id="inventory-fortified"></div>
        </div>

        <!-- Aromatized Wines -->
        <div class="inventory-section">
          <div class="section-header">
            <span class="section-icon" id="icon-aromatized"></span>
            <span class="section-title">Aromatized Wines</span>
          </div>
          <div class="section-body" id="inventory-aromatized"></div>
        </div>

        <!-- Sparkling Wines -->
        <div class="inventory-section">
          <div class="section-header">
            <span class="section-icon" id="icon-sparkling"></span>
            <span class="section-title">Sparkling Wines</span>
          </div>
          <div class="section-body" id="inventory-sparkling"></div>
        </div>

        <!-- Bitters -->
        <div class="inventory-section">
          <div class="section-header">
            <span class="section-icon" id="icon-bitters"></span>
            <span class="section-title">Bitters</span>
          </div>
          <div class="section-body" id="inventory-bitters"></div>
        </div>

        <!-- Mixers -->
        <div class="inventory-section">
          <div class="section-header">
            <span class="section-icon" id="icon-mixers"></span>
            <span class="section-title">Mixers</span>
          </div>
          <div class="section-body" id="inventory-mixers"></div>
        </div>

        <!-- Perishables -->
        <div class="inventory-section">
          <div class="section-header">
            <span class="section-icon" id="icon-perishables"></span>
            <span class="section-title">Perishables</span>
          </div>
          <div class="section-body" id="inventory-perishables"></div>
        </div>

        <!-- Add Item -->
        <div class="inventory-add">
          <input
            type="text"
            id="add-item-input"
            placeholder="Add bottle or ingredient (e.g., Campari, Lillet Blanc, Lemons)"
          />
          <button id="add-item-button">Add</button>
        </div>
      </section>

      <!-- RECIPES PANEL -->
      <section class="panel recipes-panel">
        <div class="recipes-header">
          <h2>Recipes</h2>

          <!-- SEARCH + FILTERS -->
          <div class="recipes-filters">
            <input
              type="text"
              id="recipe-search"
              placeholder="Search by name or ingredient..."
            />

            <select id="filter-base">
              <option value="">All bases</option>
              <option value="Gin">Gin</option>
              <option value="Vodka">Vodka</option>
              <option value="Tequila Blanco">Tequila Blanco</option>
              <option value="Tequila Reposado">Tequila Reposado</option>
              <option value="Light Rum">Light Rum</option>
              <option value="Dark Rum">Dark Rum</option>
              <option value="Aged Rum">Aged Rum</option>
              <option value="Bourbon">Bourbon</option>
              <option value="Rye">Rye</option>
              <option value="Scotch">Scotch</option>
              <option value="Mezcal">Mezcal</option>
              <option value="Brandy">Brandy</option>
              <option value="Other Spirits">Other Spirits</option>
            </select>

            <select id="filter-flavor">
              <option value="">All flavors</option>
              <option value="Refreshing">Refreshing</option>
              <option value="Citrusy">Citrusy</option>
              <option value="Fruity">Fruity</option>
              <option value="Sweet">Sweet</option>
              <option value="Dry">Dry</option>
              <option value="Bitter">Bitter</option>
              <option value="Herbal">Herbal</option>
              <option value="Smoky">Smoky</option>
              <option value="Rich">Rich</option>
              <option value="Creamy">Creamy</option>
              <option value="Tropical">Tropical</option>
              <option value="Nutty">Nutty</option>
              <option value="Chocolate">Chocolate</option>
              <option value="Dessert">Dessert</option>
              <option value="Spicy">Spicy</option>
              <option value="Floral">Floral</option>
            </select>
          </div>

          <!-- MODE BUTTONS -->
          <div class="recipes-controls">
            <button id="filter-all">All Recipes</button>
            <button id="filter-ready">Ready Now</button>
            <button id="filter-one-away">One Away</button>
            <button id="surprise-me">Surprise Me</button>
          </div>
        </div>

        <div id="recipe-list"></div>
      </section>

    </main>

    <!-- RECIPE MODAL -->
    <div id="recipe-modal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-close" id="modal-close">×</button>
        <h2 id="modal-title"></h2>
        <p id="modal-subtitle"></p>

        <div class="modal-section">
          <h3>Ingredients</h3>
          <ul id="modal-ingredients"></ul>
        </div>

        <div class="modal-section">
          <h3>Substitution Notes</h3>
          <div id="modal-substitutions"></div>
        </div>

        <div class="modal-section">
          <h3>Instructions</h3>
          <p id="modal-instructions"></p>
        </div>
      </div>
    </div>

  </div>

  <!-- JS FILES -->
  <script src="icons.js"></script>
  <script src="recipes.js"></script>
  <script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlueBar</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="theme-dark">
  <header class="app-header">
    <h1>BlueBar</h1>
    <div class="header-controls">
      <button id="theme-toggle" class="toggle-button">Dark</button>
      <input
        id="inventory-search"
        type="text"
        placeholder="Search inventory..."
        class="search-input"
      />
    </div>
  </header>

  <!-- Inventory Sections -->
  <main>
    <section class="inventory-section">
      <div class="section-header">
        <span class="section-icon" id="liquor-header-icon"></span>
        <h2>Liquors & Spirits</h2>
      </div>
      <div id="liquor-grid" class="icon-grid"></div>
    </section>

    <section class="inventory-section">
      <div class="section-header">
        <span class="section-icon" id="mixer-header-icon"></span>
        <h2>Mixers</h2>
      </div>
      <div id="mixer-grid" class="icon-grid"></div>
    </section>

    <section class="inventory-section">
      <div class="section-header">
        <span class="section-icon" id="perishable-header-icon"></span>
        <h2>Perishables</h2>
      </div>
      <div id="perishables-container" class="perishables-buttons"></div>
      <div id="perishable-grid" class="icon-grid"></div>
    </section>

    <!-- Recipe Engine -->
    <section class="recipe-section">
      <h2>What Can I Make?</h2>
      <div class="recipe-columns">
        <div class="recipe-column">
          <h3>Ready Now</h3>
          <ul id="recipes-ready" class="recipe-list"></ul>
        </div>
        <div class="recipe-column">
          <h3>One Ingredient Away</h3>
          <ul id="recipes-one-away" class="recipe-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="icons.js"></script>
  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>

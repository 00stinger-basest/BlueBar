<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlueBar</title>

  <!-- Basic styling (you can move this to style.css later) -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    header {
      padding: 20px;
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }

    /* Search + Filters Row */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    input, select, button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      font-size: 15px;
    }

    input {
      flex: 1;
      min-width: 200px;
    }

    button {
      background: #1e1e1e;
      color: #fff;
      cursor: pointer;
      border: 1px solid #333;
    }

    button.active {
      background: #007aff;
      border-color: #007aff;
    }

    /* Inventory */
    #inventory {
      padding: 20px;
      border-bottom: 1px solid #222;
    }

    .inventory-sections {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .inventory-section {
      background: #1a1a1a;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #333;
      transition: 0.2s;
    }

    .inventory-section:hover {
      background: #222;
    }

    #inventory-detail {
      margin-top: 16px;
      padding: 12px;
      background: #141414;
      border-radius: 6px;
      border: 1px solid #333;
    }

    /* Recipes */
    #recipes {
      padding: 20px;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .recipe-card {
      background: #1a1a1a;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #333;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      opacity: 0;
      transform: translateY(10px);
    }

    .recipe-card.card-animate {
      opacity: 1;
      transform: translateY(0);
    }

    .recipe-card.card-hover {
      transform: scale(1.03);
      box-shadow: 0 0 12px rgba(0, 122, 255, 0.4);
    }

    .recipe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .favorite-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 28px;
      height: 28px;
      color: #ff4d4d;
    }

    .ingredient-list,
    .onhand-list,
    .missing-list,
    .inventory-list {
      list-style: none;
      padding-left: 0;
      margin: 8px 0;
    }

    .tag {
      display: inline-block;
      background: #222;
      padding: 4px 8px;
      border-radius: 6px;
      margin-right: 6px;
      margin-top: 6px;
      font-size: 12px;
      border: 1px solid #333;
    }

    .onhand-none {
      color: #888;
    }

    .onhand-item {
      color: #4cd964;
    }

    .missing-none {
      color: #4cd964;
    }
  </style>
</head>

<body>

  <!-- ============================== -->
  <!-- HEADER + SEARCH + FILTERS -->
  <!-- ============================== -->
  <header>
    <h1>BlueBar</h1>

    <div class="controls">
      <input id="searchInput" type="text" placeholder="Search cocktails..." />

      <select id="filterBase">
        <option value="All">All Bases</option>
        <option value="Gin">Gin</option>
        <option value="Vodka">Vodka</option>
        <option value="Bourbon">Bourbon</option>
        <option value="Rye">Rye</option>
        <option value="Light Rum">Light Rum</option>
        <option value="Aged Rum">Aged Rum</option>
        <option value="Dark Rum">Dark Rum</option>
        <option value="Tequila Blanco">Tequila Blanco</option>
        <option value="Tequila Reposado">Tequila Reposado</option>
        <option value="Mezcal">Mezcal</option>
        <option value="Scotch">Scotch</option>
        <option value="Cognac">Cognac</option>
        <option value="Other Spirits">Other Spirits</option>
      </select>

      <select id="filterFlavor">
        <option value="All">All Flavors</option>
        <option value="Citrusy">Citrusy</option>
        <option value="Refreshing">Refreshing</option>
        <option value="Sweet">Sweet</option>
        <option value="Dry">Dry</option>
        <option value="Herbal">Herbal</option>
        <option value="Spirit-forward">Spirit-forward</option>
        <option value="Fruity">Fruity</option>
        <option value="Bitter">Bitter</option>
        <option value="Creamy">Creamy</option>
        <option value="Smoky">Smoky</option>
        <option value="Tropical">Tropical</option>
        <option value="Rich">Rich</option>
      </select>

      <button id="favoritesToggle">★ Favorites</button>
    </div>
  </header>

  <!-- ============================== -->
  <!-- INVENTORY -->
  <!-- ============================== -->
  <section id="inventory"></section>

  <!-- ============================== -->
  <!-- RECIPES -->
  <!-- ============================== -->
  <section id="recipes"></section>

  <!-- ============================== -->
  <!-- SCRIPTS -->
  <!-- ============================== -->
<script src="icons.js"></script>
<script src="recipes.js"></script>
<script src="app.js"></script>

</body>
</html>
